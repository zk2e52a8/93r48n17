name: Mango - Punto De Vista Del Lector Omnisciente

env:
  comando_script: node ./mango_scraping.js "series/punto-de-vista-del-lector-omnisciente" "Mango - Punto De Vista Del Lector Omnisciente" "mango_feed_punto-de-vista-del-lector-omnisciente.json"
  archivo_feed: mango_feed_punto-de-vista-del-lector-omnisciente.json

concurrency:
  group: scraping
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 0 */1 * *'
  workflow_dispatch:

jobs:
  ejecutar_script:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Instalar WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf

      - name: Configurar WireGuard
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          sudo install -d -m 700 /etc/wireguard
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
    
      - name: Clonar repositorio privado
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6

      - name: Instalar dependencias
        run: |
          npm install --prefix /tmp/scraping puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
          npx puppeteer browsers install chrome

      - name: Ejecutar script
        run: |
          export NODE_PATH=/tmp/scraping/node_modules
          bash -c "$comando_script"

      - name: Configurar git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Subir cambios al repo
        run: |
          if git status --porcelain | grep -q .; then
            git add --all
            git commit -m "Actualizado: $archivo_feed"
            git push origin main
          else
            echo "Sin cambios"
          fi
